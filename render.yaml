# Render Blueprint — 一鍵把後端部署到 Render 免費 web service
#
# 怎麼用：
#   1) 到 https://dashboard.render.com/select-repo?type=blueprint
#   2) 選 GitHub repo: kensong0518/voyago-fullstack
#   3) Render 會讀到這個檔案，建立服務後讓你填 6 個 env var（畫面會問）
#   4) 部署完成後拿到 https://voyago-backend-xxxx.onrender.com 這個網址，
#      填回 netlify.toml 的 proxy 與 Render 的 FRONTEND_ORIGIN
#
# 免費 tier 限制：閒置 15 分鐘會睡，下次請求約 30 秒冷啟動。Demo 夠用。

services:
  - type: web
    name: voyago-backend
    runtime: docker
    # Render 不接受非 ASCII 路徑，Dockerfile 放在根目錄（見 backend.Dockerfile 開頭說明）
    dockerfilePath: ./backend.Dockerfile
    dockerContext: .
    plan: free
    region: singapore         # 台灣使用者最近的免費機房
    healthCheckPath: /actuator/health
    autoDeploy: true          # push 到 main 自動 redeploy

    envVars:
      # ---------- 應用設定（部署時手動填） ----------
      - key: SPRING_DATASOURCE_URL
        sync: false
        # 例： jdbc:mysql://gateway01.us-west-2.prod.aws.tidbcloud.com:4000/voyago?useSSL=true&requireSSL=true
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
        # 例： https://gleeful-valkyrie-494d4e.netlify.app

      # ---------- 自動產生 ----------
      - key: JWT_SECRET
        generateValue: true   # Render 會生成隨機強密鑰

      # ---------- 後台管理員 ----------
      - key: ADMIN_EMAILS
        sync: false
        # 逗號分隔；這些 Google 帳號登入即進後台，其他人一律是一般會員。例：you@gmail.com
      - key: SEED_DEMO_STAFF
        value: "false"
        # 公開站台不種入密碼寫在 README 的示範客服帳號

      # ---------- Google 登入（後台要靠它） ----------
      - key: GOOGLE_CLIENT_ID
        sync: false
        # 必須和前端 VITE_GOOGLE_CLIENT_ID 相同
      - key: TRUSTED_PROXIES
        sync: false
        # 若 Render 的 edge 本身會在轉發給容器前附上 X-Forwarded-For，填入該來源 IP 才會被信任；
        # 留空＝一律用實際連線位址限流，不信任任何 X-Forwarded-For
      - key: MAIL_HOST
        sync: false
        # 留空＝訂單確認信功能安全跳過，不影響付款主流程。例：smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
        # 例： noreply@yourdomain.com

      # ---------- JVM tuning（免費方案：512MB、只有一小部分 CPU） ----------
      # SerialGC + 只用 C1 編譯器：少開背景執行緒，啟動時不跟主程式搶那一點 CPU。
      # 用 G1 + 完整 JIT 時，Spring Boot 在免費方案啟動超過 Render 的部署時限。
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"

      # ---------- 資料表由 資料庫/01_schema.sql 管理 ----------
      # 正式環境不讓 Hibernate 每次啟動都跨區掃描整個 schema（ddl-auto=update），
      # 也不讓它擅自改表；結構變更一律走 SQL 檔。本機開發仍沿用 application.yml 的 update。
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: none
