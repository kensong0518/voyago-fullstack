server:
  port: ${PORT:8080}

spring:
  application:
    name: voyago-backend
  datasource:
    url: jdbc:mysql://localhost:3306/voyago?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 604800000
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  # 網站公開網址：行程頁分享預覽的 og:url。沒設就用 FRONTEND_ORIGIN（單一網址部署時兩者相同）
  public-url: ${PUBLIC_URL:${FRONTEND_ORIGIN:http://localhost:5173}}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  # 後台管理員：逗號分隔的 Email，用 Google 登入時自動成為 STAFF
  admin-emails: ${ADMIN_EMAILS:}
  # 是否種入密碼公開的示範客服帳號 staff@voyago.com（本機示範用；公開站台請設 false）
  seed-demo-staff: ${SEED_DEMO_STAFF:true}
  security:
    # 只有來自這些 IP 的請求，才會信任它附上的 X-Forwarded-For（例如雲端平台的負載平衡器）。
    # 留空＝完全不信任 X-Forwarded-For，一律用實際連線位址，避免被偽造 header 繞過限流。
    trusted-proxies: ${TRUSTED_PROXIES:}
    # 部署在 Render 這類平台時設 true：容器只能透過平台代理連到，私有網段的連線就是代理，
    # 才能從 X-Forwarded-For 取得真實訪客 IP（否則全站訪客共用一個限流額度）。詳見 ClientIpResolver
    trust-private-network-proxies: ${TRUST_PRIVATE_NETWORK_PROXIES:false}
    # 平台若另外提供可信任的訪客 IP header（例如 CF-Connecting-IP），填在這裡會優先採用
    client-ip-header: ${CLIENT_IP_HEADER:}
  ai:
    gemini:
      # 到 https://aistudio.google.com/apikey 免費申請；沒設定時 AI 顧問顯示「尚未啟用」，其他功能不受影響
      api-key: ${GEMINI_API_KEY:}
      # Google 維護的「最新 Flash」別名，模型改版不用改程式；要固定版本可設 GEMINI_MODEL
      model: ${GEMINI_MODEL:gemini-flash-latest}
    daily-limit-per-client: ${AI_DAILY_LIMIT:10}
    daily-limit-global: ${AI_DAILY_GLOBAL_LIMIT:300}
  mail:
    # 訂單確認信寄件人；MAIL_HOST 沒設定時整個寄信流程會安全跳過，不影響付款主流程。
    from: ${MAIL_FROM:noreply@voyago.example.com}

# 只暴露 health 與 info，不洩漏 env / heapdump / 其他敏感端點
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # 寄信是選用功能（沒設 MAIL_HOST 就跳過、寄失敗也不影響付款），不該決定服務死活。
    # 否則沒有郵件伺服器時健康檢查一律 DOWN，雲端平台會判定部署失敗、永遠不上線。
    # 資料庫的健康檢查保留：連不上 DB 才是真的不能服務。
    mail:
      enabled: false
