# 正式站已改成 Render 上的單一服務（同一個網址提供網頁與 API，見根目錄 Dockerfile）。
# 這個 Netlify 站台只保留舊網址：所有路徑 301 永久轉址到正式站，已經分享出去的舊連結不會失效。
#
# 部署方式：python3 scripts/build_netlify_drop.py → 把產出的 netlify-drop.zip 拖進 Netlify 的 Deploys 頁。

[build]
  # 沒有建置步驟：只發布一個轉址說明頁（真正的轉址由下面的 redirects 處理）
  publish = "netlify-redirect"

[[redirects]]
  from = "/*"
  to = "https://voyago-backend-c8fd.onrender.com/:splat"
  status = 301
  force = true
