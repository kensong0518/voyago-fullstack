# 正式站是 Render 上的單一服務（同一個網址提供網頁與 API，見根目錄 Dockerfile）。
# 這個 Netlify 站台保留舊網址，並當作「秒開的入口」：
#   不管打開哪個路徑，都先顯示 Voyago 的等待畫面（netlify-redirect/index.html），
#   同時喚醒 Render；醒了就帶著原本的路徑跳到正式站。
#   Render 免費方案休眠時要 30–60 秒才醒，直接開正式網址會看到空白等待，這裡至少有品牌畫面與進度。
#
# 部署方式：python3 scripts/build_netlify_drop.py → 把產出的 netlify-drop.zip 拖進 Netlify 的 Deploys 頁。

[build]
  # 沒有建置步驟，直接發布等待畫面
  publish = "netlify-redirect"

# 所有路徑都回等待畫面（200 = 網址列保持原路徑，等待畫面才知道要跳去哪一頁）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
