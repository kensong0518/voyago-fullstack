name: Deploy（合併後自動部署並驗證）

# main 的 CI 全部通過之後，呼叫 Render 的 Deploy Hook 部署「剛好那一個 commit」，
# 然後等線上網站真的換成新版（/actuator/info 回報的 commit 等於這次的），再跑一輪冒煙測試。
# 部署失敗或新版起不來，這個工作會是紅的，不用等有人發現網站壞了。
#
# 需要在 GitHub → Settings → Secrets and variables → Actions 設定：
#   RENDER_DEPLOY_HOOK_URL   Render 服務 → Settings → Deploy Hook 的網址（含 key，等於密碼）
# 沒設定時這個工作會略過並提示，不會讓 CI 變紅。

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的 commit SHA（留空＝main 最新）"
        required: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false   # 部署中不要被下一次打斷，排隊等

env:
  SITE_URL: https://voyago-backend-c8fd.onrender.com

jobs:
  deploy:
    name: 部署到 Render 並驗證
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: 決定要部署哪一個 commit
        id: sha
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${INPUT_REF:-$RUN_SHA}"
          if [ -z "$sha" ]; then
            sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "部署 commit：$sha"

      - name: 呼叫 Render Deploy Hook
        id: hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::尚未設定 RENDER_DEPLOY_HOOK_URL，略過自動部署（到 Render 手動 Deploy latest commit）。"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "${HOOK}&ref=${{ steps.sha.outputs.sha }}")
          echo "Deploy Hook 回應：$code"
          [ "$code" = "200" ] || [ "$code" = "202" ] || { echo "::error::Deploy Hook 呼叫失敗（$code）"; exit 1; }

      - name: 等線上換成新版（最多 15 分鐘）
        if: steps.hook.outputs.skipped != 'true'
        run: |
          want="${{ steps.sha.outputs.sha }}"
          for i in $(seq 1 60); do
            got=$(curl -fsS --max-time 20 "$SITE_URL/actuator/info" 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("app",{}).get("commit",""))' 2>/dev/null || true)
            echo "[$i/60] 線上 commit：${got:-（還沒回應）}"
            if [ "$got" = "$want" ]; then echo "新版已上線"; exit 0; fi
            sleep 15
          done
          echo "::error::15 分鐘內線上沒有換成 $want，請到 Render 看部署記錄"
          exit 1

      - name: 冒煙測試（首頁、行程 API、AI 狀態、安全標頭）
        if: steps.hook.outputs.skipped != 'true'
        run: |
          set -e
          fail () { echo "::error::冒煙測試失敗：$1"; exit 1; }
          curl -fsS --max-time 30 -o /dev/null "$SITE_URL/" || fail "首頁打不開"
          echo "首頁 OK"
          n=$(curl -fsS --max-time 30 "$SITE_URL/api/routes" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))') || fail "行程 API 沒有回應"
          if [ "$n" -lt 1 ]; then fail "行程 API 回傳 0 筆"; fi
          echo "行程 API OK（$n 筆）"
          curl -fsS --max-time 30 "$SITE_URL/api/ai/status" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert "enabled" in d' || fail "AI 狀態 API 格式不對"
          echo "AI 狀態 OK"
          if ! curl -sSI --max-time 30 "$SITE_URL/" | grep -qi '^content-security-policy:'; then fail "首頁沒有 CSP 標頭"; fi
          echo "CSP 標頭 OK"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SITE_URL/api/admin/reports")
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then fail "後台 API 未登入應該被擋（401/403），實際是 $code"; fi
          echo "後台 API 未登入會被擋（$code）"
          { echo "### 部署完成"; echo "- commit \`${{ steps.sha.outputs.sha }}\`"; echo "- 冒煙測試全部通過"; } >> "$GITHUB_STEP_SUMMARY"
