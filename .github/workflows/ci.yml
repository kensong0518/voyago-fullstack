name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# 同一 PR 連續 push 時，自動取消前一次未完成的 run（節省 Actions 額度）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 後端建置 + 測試 (Spring Boot + JDK 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 後端
    steps:
      - uses: actions/checkout@v4

      - name: TEMP 查 Tomcat 版本
        run: |
          curl -fsS https://repo.maven.apache.org/maven2/org/apache/tomcat/embed/tomcat-embed-core/maven-metadata.xml | grep -o '<version>10\.1\.[0-9]*</version>' | tail -12

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven verify（含單元測試）
        run: mvn -B -ntp verify

      - name: 測試覆蓋率（JaCoCo）
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ -f "$csv" ]; then
            read -r lm lc bm bc < <(awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7} END {print lm, lc, bm, bc}' "$csv")
            line=$(awk -v m="$lm" -v c="$lc" 'BEGIN {printf "%.1f", c*100/(m+c)}')
            branch=$(awk -v m="$bm" -v c="$bc" 'BEGIN {printf "%.1f", c*100/(m+c)}')
            echo "行覆蓋率 ${line}%　分支覆蓋率 ${branch}%"
            { echo "### 後端測試覆蓋率"; echo "| | 覆蓋率 |"; echo "|---|---|"; echo "| 行 | ${line}% |"; echo "| 分支 | ${branch}% |"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上傳測試報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            後端/target/surefire-reports
            後端/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 7

      - name: 上傳 jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voyago-backend-jar
          path: 後端/target/*.jar
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: 前端建置 (Vue 3 + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 前端
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 前端/package-lock.json

      - name: 安裝套件（npm ci，確保 lockfile 一致）
        run: npm ci

      - name: 程式碼檢查（ESLint）
        run: npm run lint

      - name: 單元測試（Vitest）
        run: npm test

      - name: 建置
        run: npm run build

      - name: 上傳 dist 產物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voyago-frontend-dist
          path: 前端/dist
          if-no-files-found: ignore
          retention-days: 7

  docker-backend:
    # 用跟 Render / docker-compose 完全相同的 Dockerfile 與 build context 建一次映像，
    # 部署設定（路徑、COPY、.dockerignore）壞掉會在這裡先被抓到，而不是部署時才失敗。
    name: 整站 Docker 映像建置（與 Render 相同設定）
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker build（根目錄 Dockerfile，context = repo 根目錄）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: voyago-backend:ci

      - name: 確認前端網頁打包進去、CDS 存檔有產生
        run: |
          docker run --rm --entrypoint sh voyago-backend:ci -c '
            set -e
            mkdir -p /tmp/x && cd /tmp/x && unzip -q /app/app.jar
            test -f static/index.html && echo "index.html: OK"
            echo "js bundles: $(ls static/assets/*.js | wc -l)"
            grep -rlq 484615494439 static/assets && echo "Google client id baked into bundle: OK"
            ls -la /app/app.jsa
          '

      # 映像檔的作業系統套件與 Java 相依套件有沒有已知漏洞。
      # 只擋「已經有修正版、而且是 CRITICAL」的；HIGH 與沒有修正版的只列出來，不擋合併。
      # 直接用官方 Trivy 映像檔跑（不依賴第三方 Action 的版本標籤）。
      - name: 映像檔漏洞掃描（Trivy）
        run: |
          mkdir -p "$HOME/.cache/trivy"
          trivy () {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/work" aquasec/trivy:0.58.1 "$@"
          }
          echo "=== HIGH 與 CRITICAL（只列出，已有修正版的）==="
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 voyago-backend:ci | tee /tmp/trivy-report.txt
          { echo "### 映像檔漏洞掃描（Trivy，已有修正版的 HIGH／CRITICAL）"; echo '```'; tail -n 60 /tmp/trivy-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "=== 有修正版的 CRITICAL：有就擋下 ==="
          trivy image --severity CRITICAL --ignore-unfixed --ignorefile /work/.trivyignore.yaml --exit-code 1 --skip-db-update --skip-java-db-update voyago-backend:ci

      # 只給 0.25 顆 CPU，接近免費方案；跑到 Spring 初始化完成就結束（不連資料庫），比較有／沒有 CDS 的時間
      - name: 量測啟動時間（有 CDS vs 沒有）
        run: |
          measure () {
            docker run --rm --cpus=0.25 --memory=512m --entrypoint sh voyago-backend:ci -c "
              s=\$(date +%s%N)
              java $1 -Dspring.context.exit=onRefresh -Dapp.db.migrate=false \
                -DJWT_SECRET=ci-measure-only-not-a-real-secret-0123456789 -DDB_PASSWORD=x \
                -Dspring.datasource.url=jdbc:mysql://127.0.0.1:1/x \
                -Dspring.jpa.hibernate.ddl-auto=none \
                -Dspring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false \
                -Dspring.jpa.database-platform=org.hibernate.dialect.MySQLDialect \
                -cp '/app/app.jar:/app/lib/*' com.voyago.VoyagoApplication > /tmp/out.log 2>&1
              e=\$(date +%s%N)
              grep -q 'Root WebApplicationContext: initialization completed' /tmp/out.log || { tail -40 /tmp/out.log; exit 1; }
              echo \$(( (e - s) / 1000000 ))"
          }
          off=$(measure "-Xshare:auto")
          on=$(measure "-XX:SharedArchiveFile=/app/app.jsa -Xlog:cds=error")
          echo "沒有 CDS：${off} ms"
          echo "有 CDS：  ${on} ms"
          echo "### 冷啟動（0.25 CPU，Spring 初始化完成）" >> "$GITHUB_STEP_SUMMARY"
          echo "| | 時間 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 沒有 CDS | ${off} ms |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 有 CDS | ${on} ms |" >> "$GITHUB_STEP_SUMMARY"

