name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 同一 PR 連續 push 時，自動取消前一次未完成的 run（節省 Actions 額度）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 後端建置 + 測試 (Spring Boot + JDK 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 後端
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven verify（含單元測試）
        run: mvn -B -ntp verify

      - name: 上傳測試報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: 後端/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: 上傳 jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voyago-backend-jar
          path: 後端/target/*.jar
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: 前端建置 (Vue 3 + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 前端
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 前端/package-lock.json

      - name: 安裝套件（npm ci，確保 lockfile 一致）
        run: npm ci

      - name: 建置
        run: npm run build

      - name: 上傳 dist 產物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voyago-frontend-dist
          path: 前端/dist
          if-no-files-found: ignore
          retention-days: 7

  docker-backend:
    # 用跟 Render / docker-compose 完全相同的 Dockerfile 與 build context 建一次映像，
    # 部署設定（路徑、COPY、.dockerignore）壞掉會在這裡先被抓到，而不是部署時才失敗。
    name: 後端 Docker 映像建置（與 Render 相同設定）
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker build -f backend.Dockerfile .
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend.Dockerfile
          push: false
          load: true
          tags: voyago-backend:ci

      - name: 確認 jar 在映像裡且能啟動到 Spring 載入階段
        run: |
          docker run --rm --entrypoint sh voyago-backend:ci -c 'ls -l /app/app.jar && java -jar /app/app.jar --version 2>&1 | head -5 || true'
